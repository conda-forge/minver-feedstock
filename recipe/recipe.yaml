context:
  version: "8.0.0"

package:
  name: minver
  version: ${{ version }}

source:
  url: https://github.com/adamralph/minver/archive/${{ version }}.tar.gz
  sha256: bfefbd89589357dd074abc5d3bb3914594fef724f572ab6ce0ecfe154a4bf370

build:
  number: 0
  noarch: generic

requirements:
  host:
    - dotnet
    - nuget-license
  run:
    - dotnet

tests:
  - script:
      - minver --help

about:
  license: Apache-2.0
  license_file:
    - LICENSE
    - license-files/
  summary: Minimalistic versioning using Git tags.
  homepage: https://github.com/adamralph/minver
  repository: https://github.com/adamralph/minver

extra:
  recipe-maintainers:
    - danielnachun
